---
name: Build Unity Desktop images
on:
  workflow_dispatch:
  schedule:
    # Run every Sunday at 4 AM UTC, after the Ubuntu base images (2 AM)
    - cron: '0 4 * * 0'
  push:
    branches: [main]
    paths:
      - 'unity-desktop/**'
      - '.github/workflows/unity-desktop.yaml'

jobs:

  targets:
    name: Get build targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.json.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate JSON matrix
        id: json
        uses: docker/bake-action/subaction/matrix@v7
        with:
          files: unity-desktop/docker-bake.hcl

  unity-desktop:
    name: ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ${{ github.ref }}-${{ github.workflow }}-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.targets.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
      - name: Set SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@v7
        with:
          source: unity-desktop
          targets: ${{ matrix.target }}
          files: docker-bake.hcl
          push: ${{ github.ref == 'refs/heads/main' }}
          no-cache: ${{ github.event_name == 'schedule' }}
